<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Marca simplificada para tamaños chicos. NO es el icon-512.png reducido:
    esa ilustración a 16px es una mancha verde ilegible (probado). Acá quedan
    solo los tres rasgos que sí se leen en una pestaña — la cabeza con goterones,
    el ojo, y el fondo ink de la marca.

    Paleta igual a tailwind.config.ts: ink #0d0b0a, toxic oklch(0.72 0.19 142)
    en su equivalente sRGB #51c148 (el mismo muestreo que BRAND_RGB en
    components/NoiseHeading.tsx), y el celeste del ojo del logo.
  -->
  <rect width="64" height="64" rx="14" fill="#0d0b0a"/>
  <path d="M32 9c11.6 0 20 8.3 20 19.2 0 6-2.4 10.6-6.2 14.1l.6 8.4-6.1-4.2-1.9 7.3-4.7-5.6-3.7 6.4-3.3-6.4-4.6 5.2-2-7-6 4 .6-8.3C10.6 38.7 12 34.1 12 28.2 12 17.3 20.4 9 32 9z" fill="#51c148"/>
  <ellipse cx="32" cy="27" rx="13" ry="10" fill="#0d0b0a"/>
  <circle cx="32" cy="27" r="6.4" fill="#22b8d4"/>
  <circle cx="32" cy="27" r="2.8" fill="#0d0b0a"/>
</svg>
