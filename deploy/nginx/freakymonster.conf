# Config de referencia para /etc/nginx/sites-available/freakymonster en el
# VPS. Este es el punto de partida (antes de Certbot) — la primera vez que
# se corre `sudo certbot --nginx -d freakymonster.dipaoloproyects.space`,
# Certbot reescribe este archivo agregando el bloque `listen 443 ssl` con
# los certificados y el redirect 80→443. Ese archivo final vive solo en el
# servidor (managed by Certbot), no hace falta trackearlo acá — si hay que
# rearmar el servidor desde cero, se parte de este archivo y se vuelve a
# correr Certbot.
#
# Ver README.md → "Deploy a producción" para el procedimiento completo.

server {
    listen 80;
    listen [::]:80;
    server_name freakymonster.dipaoloproyects.space;

    # /api/* va tal cual al backend (sin sacar el prefijo): NestJS tiene
    # setGlobalPrefix('api'), así que sus rutas internas son /api/health,
    # /api/availability, etc. proxy_pass SIN path al final preserva la URI
    # completa tal como llegó — si tuviera una barra final ("http://.../")
    # Nginx recortaría el prefijo /api antes de reenviar, y todo rompería.
    location /api/ {
        proxy_pass http://localhost:3301;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Imágenes y demás archivos de apps/web/public/ (hero.jpg, logo.png,
    # og-image.jpg, favicons…). Next los sirve con `Cache-Control:
    # public, max-age=0` —o sea, revalidación en CADA visita— porque no puede
    # saber si el archivo cambió: a diferencia de /_next/static/, estas URLs no
    # llevan hash en el nombre. Medido en producción: hero.jpg son 364 KB y
    # logo.png casi 1 MB que se revalidaban en cada carga.
    #
    # Acá se corrige del lado de Nginx, que es el único lugar donde se puede:
    # no hay opción en next.config para el cache de public/.
    #
    # 30 días y no "immutable": si se pisa uno de estos archivos manteniendo el
    # nombre, la gente que lo tenga cacheado sigue viendo el viejo hasta que
    # venza. Para un cambio urgente, renombrar el archivo (logo-v2.png) es la
    # salida. Mismo criterio que `minimumCacheTTL` en apps/web/next.config.mjs,
    # que hace lo propio para las imágenes ya optimizadas por next/image.
    # El (?!api/|_next/) NO es decorativo. En Nginx una location con regex le
    # gana a una con prefijo, así que sin ese descarte este bloque se quedaría
    # con /api/uploads/foo.jpg —las fotos de tatuadores— y las mandaría al
    # contenedor de Next en vez de al de la API: fotos rotas en el panel y en
    # la home. Por lo mismo se excluye /_next/, cuyos archivos ya vienen con
    # hash en el nombre y un `immutable` de un año que sería una lástima pisar
    # con estos 30 días.
    location ~* ^/(?!api/|_next/).*\.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        proxy_pass http://localhost:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # `always` porque sin eso Nginx no agrega la cabecera en respuestas
        # 304, que son justo las que más se repiten acá.
        add_header Cache-Control "public, max-age=2592000" always;
        # El Cache-Control que ya venía de Next (max-age=0) llegaría duplicado
        # y el navegador se queda con el más restrictivo, anulando lo de arriba.
        proxy_hide_header Cache-Control;
    }

    location / {
        proxy_pass http://localhost:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
