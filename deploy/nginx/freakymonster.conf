# Config de referencia para /etc/nginx/sites-available/freakymonster en el
# VPS. Este es el punto de partida (antes de Certbot) — la primera vez que
# se corre `sudo certbot --nginx -d freakymonster.dipaoloproyects.space`,
# Certbot reescribe este archivo agregando el bloque `listen 443 ssl` con
# los certificados y el redirect 80→443. Ese archivo final vive solo en el
# servidor (managed by Certbot), no hace falta trackearlo acá — si hay que
# rearmar el servidor desde cero, se parte de este archivo y se vuelve a
# correr Certbot.
#
# Ver README.md → "Deploy a producción" para el procedimiento completo.

server {
    listen 80;
    listen [::]:80;
    server_name freakymonster.dipaoloproyects.space;

    # /api/* va tal cual al backend (sin sacar el prefijo): NestJS tiene
    # setGlobalPrefix('api'), así que sus rutas internas son /api/health,
    # /api/availability, etc. proxy_pass SIN path al final preserva la URI
    # completa tal como llegó — si tuviera una barra final ("http://.../")
    # Nginx recortaría el prefijo /api antes de reenviar, y todo rompería.
    location /api/ {
        proxy_pass http://localhost:3301;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://localhost:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
