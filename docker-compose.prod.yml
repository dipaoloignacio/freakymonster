# Deploy de producción. Correr con:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# postgres NO publica puerto al host (solo red interna de Docker). api y web
# publican en 127.0.0.1 únicamente — nunca 0.0.0.0 — para que solo Nginx
# (corriendo en este mismo servidor) pueda llegar, no el mundo entero
# saltándose el proxy.

name: freakymonster-prod

services:
  postgres:
    image: postgres:16
    container_name: freakymonster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - freakymonster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: freakymonster-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL}
      STUDIO_NOTIFICATION_EMAIL: ${STUDIO_NOTIFICATION_EMAIL}
      PORT: 3001
    ports:
      - "127.0.0.1:${API_PORT:-3301}:3001"
    volumes:
      # Fotos de tatuadores subidas desde el panel de admin — sin esto, un
      # rebuild del contenedor las borraría (el filesystem de la imagen no
      # persiste). main.ts las sirve como estático bajo /api/uploads/.
      - freakymonster_uploads:/repo/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: freakymonster-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      # URL que usa el RENDER DEL SERVIDOR para leer la API (la sección
      # Artistas de la home). No confundir con NEXT_PUBLIC_API_URL, que es la
      # del navegador y vale "/api": relativa, y por lo tanto imposible de
      # fetchear desde el servidor. Va por el nombre de servicio de la red
      # interna de compose, sin pasar por Nginx. Ver apps/web/lib/serverApi.ts.
      API_INTERNAL_URL: http://api:3001/api
    ports:
      - "127.0.0.1:${WEB_PORT:-3300}:3000"

volumes:
  freakymonster_postgres_data:
  freakymonster_uploads:
