services:
  postgres:
    image: postgres:16
    container_name: tattoo-studio-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tattoo_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tattoo_studio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tattoo_studio_dev}
    volumes:
      - tattoo_studio_postgres_data:/var/lib/postgresql/data

volumes:
  tattoo_studio_postgres_data:
